# ThinkUI — nginx vhost
# Deployed to /etc/nginx/sites-available/thinkui by deploy/deploy-site.sh
#
# Cloudflare proxies the domain (orange cloud, Full mode), so the edge terminates the
# public TLS session and this server answers on 443 with an origin certificate that
# only Cloudflare ever sees. When the zone goes active, swap the self-signed cert for a
# Cloudflare Origin CA one (deploy/origin-cert.py) and switch the zone to Full (strict).
#
# The /mcp block at the bottom is the authenticated MCP endpoint; it stays commented
# until the auth service is running, so the corpus is never reachable unauthenticated.

# www is a different name, not a different site. It exists here only to send people to
# the one canonical host, so both schemes point at https://thinkui.xyz in a single hop.
server {
    listen 80;
    listen [::]:80;
    server_name www.thinkui.xyz;
    return 301 https://thinkui.xyz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.thinkui.xyz;

    ssl_certificate     /etc/ssl/thinkui/origin.pem;
    ssl_certificate_key /etc/ssl/thinkui/origin.key;
    return 301 https://thinkui.xyz$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name thinkui.xyz;

    # Cloudflare talks to the origin over https; plain http is only for ACME and for
    # an old bookmarked link, so it goes to https without a round trip
    return 301 https://thinkui.xyz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name thinkui.xyz;

    ssl_certificate     /etc/ssl/thinkui/origin.pem;
    ssl_certificate_key /etc/ssl/thinkui/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # Traffic arrives through the Cloudflare tunnel, which connects to nginx over
    # loopback — so every visitor was logged as 127.0.0.1 and the access log could not
    # tell one person from another (5,171 "visitors" were one address). Trust the header
    # Cloudflare sets, but only from loopback: otherwise anyone could spoof their IP.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    root /var/www/thinkui;
    index index.html;

    charset utf-8;
    server_tokens off;

    # OAuth 2.1 for MCP connectors (ChatGPT, Claude, Cursor). Discovery and the flow live
    # in the account service because the issuer, the endpoints and the token logic have to
    # agree; a static file could describe endpoints that do not exist. The rest of
    # /.well-known/ (mcp.json, the skills index) stays static.
    location = /.well-known/oauth-protected-resource {
        proxy_pass http://127.0.0.1:8788;
        include proxy_params;
    }
    location = /.well-known/oauth-protected-resource/mcp {
        proxy_pass http://127.0.0.1:8788;
        include proxy_params;
    }
    location = /.well-known/oauth-authorization-server {
        proxy_pass http://127.0.0.1:8788;
        include proxy_params;
    }
    location /oauth/ {
        proxy_pass http://127.0.0.1:8788;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
    }

    # clean URLs: /pricing serves pricing.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # One URL per page. The canonical (and the sitemap) name the extension-less form, so
    # the .html twin redirects instead of serving a second, indexable copy of the page.
    # Must sit above the generic \.html$ rule: first matching regex wins in nginx.
    #
    # NOT /index.html: "index index.html" makes nginx reach the file by an internal
    # redirect to /index.html, which re-enters location matching - redirecting it back to
    # "/" is a loop that takes the whole front page down. "/" is already canonical.
    location ~ ^/(pricing|docs|login|signup|terms|privacy)\.html$ { return 301 /$1; }

    # The clean URLs are served by a direct file lookup (try_files $uri.html), which does
    # NOT re-enter location matching - so the .html$ rule below never ran for them and
    # /login went out with no Cache-Control at all. A browser is then free to keep that
    # copy indefinitely, which is how an account page from months ago kept resurfacing on
    # a phone. These pages are no-store: one hard refresh must never be needed twice.
    location ~ ^/(pricing|docs|examples|login|signup|terms|privacy)$ {
        try_files $uri.html =404;
        add_header Cache-Control "no-store, must-revalidate";
    }

    # /404 is not a page - without this it answered 200 with the not-found body (a soft 404)
    location = /404 { return 404; }

    # strict manifest consumers reject the octet-stream default nginx would send
    location = /site.webmanifest {
        types { }
        default_type application/manifest+json;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # the corpus browser this site used to be: old addresses still work
    location = /screens   { return 301 /docs; }
    location = /materials { return 301 /docs; }
    location = /sources   { return 301 /docs; }
    location = /elements  { return 301 /docs; }
    location = /icons     { return 301 /docs; }

    # The "how it works" section lives on the homepage. The old path keeps working.
    location = /how-it-works { return 301 /#how; }

    location ~* \.(css|js|svg|png|ico|webmanifest|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;
    gzip_vary on;

    # --- the account service: sign in, keys, usage, billing ------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8788;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;   # nothing this API accepts is bigger than a form
    }

    location = /account {
        proxy_pass http://127.0.0.1:8788;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # uptime checks land here; it reports whether the database, billing and email are
    # wired, and nothing that is secret
    location = /health {
        proxy_pass http://127.0.0.1:8788;
        include proxy_params;
        access_log off;
    }

    #
    location = /mcp {
        # HEAD is a probe (uptime checks, clients confirming the URL), not a tool call.
        # Answer it here with the same 401 challenge a credential-less GET gets, so the
        # probe does not depend on the MCP process. The body is what HEAD reports as
        # Content-Length; the bytes themselves are not sent.
        if ($request_method = HEAD) {
            rewrite ^ /_mcp_head last;
        }

        auth_request /_keycheck;        # nginx asks the account service about the key
        # auth_request only understands 401 and 403. Any other code from the subrequest
        # is treated as an internal error, so a spent quota used to reach the customer as
        # a bare 500. The account service now answers 403 for both, and the two cases get
        # their own explanation below.
        error_page 401 = @mcp_unauth;
        error_page 403 = @mcp_quota;

        # The gate's verdict on the plan rides to the MCP server, which meters Free-plan
        # tools/call requests against the account's free allowance (12 calls, lifetime)
        # and lets paid plans straight through. proxy_set_header REPLACES any header of
        # the same name the client sent, so a caller cannot claim a paid plan.
        auth_request_set $thinkui_plan $upstream_http_x_thinkui_plan;
        proxy_set_header X-ThinkUI-Plan $thinkui_plan;

        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # the MCP server refuses requests whose Host it does not recognise (DNS-rebinding
        # guard) and it only trusts loopback, so the public name stops here
        proxy_set_header Host 127.0.0.1:8765;
        proxy_buffering off;            # streamable HTTP must not be buffered
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /_mcp_head {
        internal;
        default_type application/json;
        add_header WWW-Authenticate 'Bearer resource_metadata="https://thinkui.xyz/.well-known/oauth-protected-resource"' always;
        return 401 '{"jsonrpc":"2.0","error":{"code":-32001,"message":"ThinkUI needs credentials. Send Authorization: Bearer <key> (keys at https://thinkui.xyz/account), or connect through OAuth - discovery at https://thinkui.xyz/.well-known/oauth-protected-resource"}}';
    }

    location @mcp_unauth {
        default_type application/json;
        # The challenge turns a dead-end 401 into a working connect flow: a client that
        # gets this header fetches the metadata and starts OAuth instead of showing the
        # user "unauthorized".
        add_header WWW-Authenticate 'Bearer resource_metadata="https://thinkui.xyz/.well-known/oauth-protected-resource"' always;
        return 401 '{"jsonrpc":"2.0","error":{"code":-32001,"message":"ThinkUI needs credentials. Send Authorization: Bearer <key> (keys at https://thinkui.xyz/account), or connect through OAuth - discovery at https://thinkui.xyz/.well-known/oauth-protected-resource"}}';
    }

    # A refused call is not a server fault: say what happened and what fixes it. No plan
    # has a monthly ceiling at the gate any more (free calls are metered per tools/call by
    # the MCP server, which answers with a tool result), so this is a fallback only.
    location @mcp_quota {
        default_type application/json;
        return 403 '{"jsonrpc":"2.0","error":{"code":-32002,"message":"ThinkUI refused this call for the account plan. See https://thinkui.xyz/account or choose a plan at https://thinkui.xyz/pricing - the same key keeps working."}}';
    }

    location = /_keycheck {
        internal;
        proxy_pass http://127.0.0.1:8788/api/verify-key;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Api-Key $http_x_api_key;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
