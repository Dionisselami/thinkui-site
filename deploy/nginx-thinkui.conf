# ThinkUI — nginx vhost
# Deployed to /etc/nginx/sites-available/thinkui by deploy/deploy-site.sh
#
# Cloudflare proxies the domain (orange cloud, Full mode), so the edge terminates the
# public TLS session and this server answers on 443 with an origin certificate that
# only Cloudflare ever sees. When the zone goes active, swap the self-signed cert for a
# Cloudflare Origin CA one (deploy/origin-cert.py) and switch the zone to Full (strict).
#
# The /mcp block at the bottom is the authenticated MCP endpoint; it stays commented
# until the auth service is running, so the corpus is never reachable unauthenticated.

# www is a different name, not a different site. It exists here only to send people to
# the one canonical host, so both schemes point at https://thinkui.xyz in a single hop.
server {
    listen 80;
    listen [::]:80;
    server_name www.thinkui.xyz;
    return 301 https://thinkui.xyz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.thinkui.xyz;

    ssl_certificate     /etc/ssl/thinkui/origin.pem;
    ssl_certificate_key /etc/ssl/thinkui/origin.key;
    return 301 https://thinkui.xyz$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name thinkui.xyz;

    # Cloudflare talks to the origin over https; plain http is only for ACME and for
    # an old bookmarked link, so it goes to https without a round trip
    return 301 https://thinkui.xyz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name thinkui.xyz;

    ssl_certificate     /etc/ssl/thinkui/origin.pem;
    ssl_certificate_key /etc/ssl/thinkui/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    root /var/www/thinkui;
    index index.html;

    charset utf-8;
    server_tokens off;

    # clean URLs: /pricing serves pricing.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # One URL per page. The canonical (and the sitemap) name the extension-less form, so
    # the .html twin redirects instead of serving a second, indexable copy of the page.
    # Must sit above the generic \.html$ rule: first matching regex wins in nginx.
    #
    # NOT /index.html: "index index.html" makes nginx reach the file by an internal
    # redirect to /index.html, which re-enters location matching - redirecting it back to
    # "/" is a loop that takes the whole front page down. "/" is already canonical.
    location ~ ^/(pricing|docs|login|signup|terms|privacy)\.html$ { return 301 /$1; }

    # /404 is not a page - without this it answered 200 with the not-found body (a soft 404)
    location = /404 { return 404; }

    # strict manifest consumers reject the octet-stream default nginx would send
    location = /site.webmanifest {
        types { }
        default_type application/manifest+json;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # the corpus browser this site used to be: old addresses still work
    location = /screens   { return 301 /docs; }
    location = /materials { return 301 /docs; }
    location = /sources   { return 301 /docs; }
    location = /elements  { return 301 /docs; }
    location = /icons     { return 301 /docs; }

    location ~* \.(css|js|svg|png|ico|webmanifest|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;
    gzip_vary on;

    # --- the account service: sign in, keys, usage, billing ------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8788;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;   # nothing this API accepts is bigger than a form
    }

    location = /account {
        proxy_pass http://127.0.0.1:8788;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # uptime checks land here; it reports whether the database, billing and email are
    # wired, and nothing that is secret
    location = /health {
        proxy_pass http://127.0.0.1:8788;
        include proxy_params;
        access_log off;
    }

    #
    location = /mcp {
        auth_request /_keycheck;        # nginx asks the account service about the key
        # auth_request only understands 401 and 403. Any other code from the subrequest
        # is treated as an internal error, so a spent quota used to reach the customer as
        # a bare 500. The account service now answers 403 for both, and the two cases get
        # their own explanation below.
        error_page 401 = @mcp_unauth;
        error_page 403 = @mcp_quota;

        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # the MCP server refuses requests whose Host it does not recognise (DNS-rebinding
        # guard) and it only trusts loopback, so the public name stops here
        proxy_set_header Host 127.0.0.1:8765;
        proxy_buffering off;            # streamable HTTP must not be buffered
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location @mcp_unauth {
        default_type application/json;
        return 401 '{"jsonrpc":"2.0","error":{"code":-32001,"message":"ThinkUI needs a valid API key. Send Authorization: Bearer tk_... - get one at https://thinkui.xyz/account"}}';
    }

    # A spent monthly allowance is not a server fault: say what happened and what fixes it.
    location @mcp_quota {
        default_type application/json;
        return 403 '{"jsonrpc":"2.0","error":{"code":-32002,"message":"Monthly tool-call limit reached on this plan. Upgrade at https://thinkui.xyz/account and the same key keeps working."}}';
    }

    location = /_keycheck {
        internal;
        proxy_pass http://127.0.0.1:8788/api/verify-key;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Api-Key $http_x_api_key;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
